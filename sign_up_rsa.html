[10/4/2026 10:02 AM] bret: <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSA Enrollment / Sign Up</title>
    <script src="https://cdn.jsdelivr.net/npm/jsencrypt@latest/bin/jsencrypt.min.js"></script>
    <link rel="stylesheet" href="sursa.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>RSA Enrollment / Sign Up</h1>
            <p>RSA Asymmetric Encryption / Decryption</p>
        </header>

        <section class="card">

            <h2>Enrollment / Sign Up</h2>

            <form id="signupForm">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="Juan Dela Cruz"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="birthDate">Date of Birth</label>
                    <input
                        type="date"
                        id="birthDate"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="yearLevel">Year Level</label>

                    <select id="yearLevel" required>
                        <option value="">Select Year Level</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>

                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Prefer not to say">
                            Prefer not to say
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="juan123"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <button type="submit" id="signupButton">
                    Sign Up
                </button>

                <p id="statusMessage"></p>

            </form>

        </section>

        <section class="card" id="resultsSection" hidden>

            <h2>RSA Encryption / Decryption Result</h2>

            <div class="rsa-box">

                <h3>1024-bit RSA</h3>

                <label>Encrypted Data:</label>

                <textarea
                    id="encrypted1024"
                    readonly
                ></textarea>


                <label>Decrypted Data:</label>

                <textarea
                    id="decrypted1024"
                    readonly
                ></textarea>

            </div>


            <!-- 3072 BIT -->
            <div class="rsa-box">

                <h3>3072-bit RSA</h3>
                <textarea
                    id="encrypted3072"
                    readonly
                ></textarea>


                <label>Decrypted Data:</label>

                <textarea
                    id="decrypted3072"
                    readonly
                ></textarea>

            </div>

        </section>

        <section class="card" id="informationSection" hidden>

            <h2>Enrollment Information</h2>

            <div class="info-row">
                <strong>Full Name:</strong>
                <span id="infoFullName"></span>
            </div>

            <div class="info-row">
                <strong>Date of Birth:</strong>
                <span id="infoBirthDate"></span>
            </div>

            <div class="info-row">
                <strong>Year Level:</strong>
                <span id="infoYearLevel"></span>
            </div>

            <div class="info-row">
                <strong>Gender:</strong>
                <span id="infoGender"></span>
            </div>

            <div class="info-row">
                <strong>Username:</strong>
                <span id="infoUsername"></span>
            </div>

        </section>

    </main>


    <script src="sursa.js"></script>

</body>
</html>
